# Ruff configuration for apps/api (no pyproject.toml in this app).
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# BLE001: blind `except Exception` mirrors the error-dict convention.
ignore = ["BLE001"]

[lint.flake8-bugbear]
# `Depends(...)` in argument defaults is idiomatic FastAPI.
extend-immutable-calls = ["fastapi.Depends"]
