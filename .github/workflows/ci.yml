name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/elsevier-mcp[dev]"
          python -m pip install -r apps/api/requirements.txt build twine
      - name: Run unit tests (elsevier-mcp)
        run: pytest packages/elsevier-mcp/tests/ -v --cov=elsevier_mcp --cov-report=term-missing --cov-fail-under=90
      - name: Run unit tests (api)
        run: pytest apps/api/tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Compile Python files
        run: python -m compileall -q packages/elsevier-mcp/elsevier_mcp packages/elsevier-mcp/elsevier_mcp_complete.py packages/elsevier-mcp/test.py apps/api/app
      - name: Build package
        run: (cd packages/elsevier-mcp && python -m build)
      - name: Check package metadata
        run: python -m twine check packages/elsevier-mcp/dist/*
      - name: Install wheel smoke
        run: |
          python -m pip install packages/elsevier-mcp/dist/*.whl --force-reinstall --no-deps
          elsevier-mcp-server --version
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: elsevier-mcp-server-dist
          path: packages/elsevier-mcp/dist/*
          if-no-files-found: error
