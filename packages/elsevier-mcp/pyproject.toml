[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elsevier-mcp-server"
version = "1.2.1"
description = "MCP server for Elsevier academic APIs including Scopus, SciVal, and Abstract Retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yasufumi Nakata" }]
keywords = ["elsevier", "scopus", "scival", "academic", "research", "mcp"]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "typing-extensions>=4.0.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "respx>=0.22.0",
  "ruff>=0.4.0",
]

[project.scripts]
elsevier-mcp-server = "elsevier_mcp.server:main"

[project.urls]
Homepage = "https://github.com/yasufumi-nakata/Elsevier_MCP"
Repository = "https://github.com/yasufumi-nakata/Elsevier_MCP"
Issues = "https://github.com/yasufumi-nakata/Elsevier_MCP/issues"
"Elsevier Developer" = "https://dev.elsevier.com/"

[tool.setuptools]
packages = ["elsevier_mcp"]
py-modules = ["elsevier_mcp_complete"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# BLE001: blind `except Exception` is the project's error-dict convention
# (handlers must never raise to the MCP caller). DTZ: naive local datetimes
# are intentional for "current year" defaults. RUF001/2/3: Japanese
# full-width characters in strings/docstrings are intentional.
ignore = ["BLE001", "DTZ", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Deprecation shim: the warning must be emitted before the re-exports run.
"elsevier_mcp_complete.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["elsevier_mcp"]
omit = ["elsevier_mcp_complete.py"]

[tool.coverage.report]
show_missing = true
precision = 1
